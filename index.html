<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Slot Machine</title>
  <link rel="stylesheet" href="style.css" />
  <script src="game.js" defer></script>
</head>
<body>

<div class="container">
  <h1>&#127920; Multiplayer Slot</h1>
  <div class="handle"></div>

  <!-- AUTH -->
  <div class="login-box" id="authBox">
    <input id="email" type="text" placeholder="Enter your username" />
    <div class="auth-buttons">
      <button onclick="login()">LOGIN</button>
    </div>
  </div>

  <!-- USER BAR -->
  <div class="user-bar hidden" id="userBar">
    <button onclick="logout()">LOGOUT</button>
    <button onclick="toggleSound()">&#128264; SOUND</button>
  </div>

  <!-- BALANCE -->
  <div class="balance-box hidden" id="balanceBox">
    Balance: $<span id="balance">0</span>
  </div>

  <!-- JACKPOT -->
  <div class="jackpot-box hidden" id="jackpotBox">
    &#128176; JACKPOT: $<span id="jackpot">5000</span>
  </div>

  <!-- STATS -->
  <div class="stats-box hidden" id="statsBox">
    <h3>&#128202; Stats</h3>
    <p>&#127915; Spins: <span id="stat-spins">0</span></p>
    <p>&#128176; Total Won: $<span id="stat-winnings">0</span></p>
    <p>&#127942; Best Win: $<span id="stat-biggest">0</span></p>
  </div>

  <!-- CONTROLS -->
  <div class="controls hidden" id="gameControls">
    <div class="deposit-row">
      <input id="deposit" type="number" placeholder="Deposit Amount" />
      <button onclick="deposit()">DEPOSIT</button>
    </div>
    <input id="lines" type="number" placeholder="Lines (1-3)" />
    <input id="bet" type="number" placeholder="Bet per Line" />
    <button onclick="play()">SPIN</button>
  </div>

  <!-- SLOT -->
  <div class="slot hidden" id="slotArea">
    <div class="row" id="row0"><span>A</span><span>B</span><span>C</span></div>
    <div class="row" id="row1"><span>B</span><span>C</span><span>D</span></div>
    <div class="row" id="row2"><span>C</span><span>D</span><span>A</span></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="leaderboard-box">
    <h3>&#127942; Leaderboard</h3>
    <ol id="leaderboard"></ol>
  </div>

  <div class="result" id="result">Login to start &#127920;</div>
</div>

</body>
</html>
